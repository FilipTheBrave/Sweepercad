<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SweeperCAD</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fafafa;
            color: #222;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 42px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .description {
            font-size: 18px;
            margin-bottom: 32px;
        }

        .download {
            display: inline-block;
            padding: 12px 20px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
        }

        .download:hover {
            background: #444;
        }

        .videos {
            margin-top: 60px;
        }

        video {
            width: 100%;
            margin-top: 16px;
            border-radius: 6px;
        }

        .contact {
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid #ddd;
        }

        a {
            color: inherit;
        }
    </style>
</head>

<body>

<main>

    <h1>SweeperCAD</h1>

    <p class="description">
        A simple description of SweeperCAD goes here.
    </p>

    <a class="download" href="#">
        Download SweeperCAD
    </a>

    <section class="videos">

        <h2>Videos</h2>

    <section class="contact">

        <p>

            </a>
        </p>

</html>
