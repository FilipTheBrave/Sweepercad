# DEPLOYS THE LIBRARY UPLOAD HELPER to Cloudflare Workers, by hand. The code
# lives in the private app repo (library-helper/); it is deployed from here so
# it costs no Actions minutes. Secrets on THIS repo:
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token ("Edit Cloudflare Workers", all Workers)
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id (32 characters)
#   LIBRARY_ROBOT_TOKEN    see library.yml - the helper uses it to start the robot here
name: Library helper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: FilipTheBrave/SweepercadApp
          token: ${{ secrets.LIBRARY_ROBOT_TOKEN }}
          sparse-checkout: library-helper
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy
        working-directory: library-helper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          T: ${{ secrets.LIBRARY_ROBOT_TOKEN }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error title=library helper::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error title=library helper::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          [ ${#CLOUDFLARE_ACCOUNT_ID} -eq 32 ] || echo "::warning title=library helper::CLOUDFLARE_ACCOUNT_ID is ${#CLOUDFLARE_ACCOUNT_ID} characters - an account id has 32"
          [ -n "$T" ] || { echo "::error title=library helper::LIBRARY_ROBOT_TOKEN is missing"; exit 1; }
          fail() { echo "::error title=library helper::$1: $(grep -iE 'error|✘|not |must|need' "$2" | grep -v '^\s*$' | tail -4 | tr '\n' ' ' | cut -c1-600)"; exit 1; }
          # the robot now runs on the public repo
          sed -i 's#^APP_REPO = .*#APP_REPO = "FilipTheBrave/Sweepercad"#' wrangler.toml
          grep APP_REPO wrangler.toml
          npx -y wrangler@4 deploy > deploy.log 2>&1 || fail "deploy" deploy.log
          printf '%s' "$T" | npx -y wrangler@4 secret put DISPATCH_TOKEN > s1.log 2>&1 || fail "secret 1" s1.log
          printf '%s' "$T:robot" | sha256sum | cut -d' ' -f1 | tr -d '\n' | npx -y wrangler@4 secret put ROBOT_KEY > s2.log 2>&1 || fail "secret 2" s2.log
          echo "::notice title=library helper::deployed - uploads now go to the public repo's robot"
